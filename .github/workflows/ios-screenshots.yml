name: iOS Simulator screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            Config
            Nook.xcodeproj
            Nook
            NookKit
            NookShare
            NookShareSave
            NookShareDiscover
            NookWidget
            NookiOS
            tools
      - name: Build current app for Simulator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/screenshots"
          git rev-parse HEAD > "$RUNNER_TEMP/screenshots/commit.txt"
          xcodebuild -project Nook.xcodeproj -scheme NookiOS \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/screenshot-build" \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$RUNNER_TEMP/screenshots/build.log"
      - name: Capture real iPhone and iPad screens
        run: |
          python3 tools/capture-ios-screenshots.py \
            "$RUNNER_TEMP/screenshot-build/Build/Products/Debug-iphonesimulator/NookiOS.app" \
            "$RUNNER_TEMP/screenshots"
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nook-screenshots-${{ github.run_id }}
          path: ${{ runner.temp }}/screenshots/
          retention-days: 14
